name: Solar System Workflow

on: 
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/*'

env:
  MONGO_URI: 'mongodb+srv://supercluster.d83jj.mongodb.net/superData'
  MONGO_USERNAME: ${{ vars.MONGO_USERNAME }}
  MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}

jobs:
  unit-testing:
    name: Unit Testing
    runs-on: ubuntu-latest
    strategy:
      matrix:
        nodejs_version: [20]
        operating_system: [ubuntu-latest]


    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup NodeJS version - ${{ matrix.nodejs_version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.nodejs_version }}
      
      - name: Cache NPM dependencies
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install Dependencies
        run: npm install
      
      - name: Unit Testing
        id: NodeJS-unit-testing-step
        run: npm test

      - name: Archive Test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Mocha-test-result-nodeJS-${{ matrix.nodejs_version }}
          path: test-results-nodeJS-${{ matrix.nodejs_version }}.xml

  code-coverage:
    name: Code Coverage
    container:
      image: node:18
      env:
        MONGO_URI: 'mongodb+srv://supercluster.d83jj.mongodb.net/superData'
        MONGO_USERNAME: ${{ vars.MONGO_USERNAME }}
        MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      # - name: Setup NodeJS version - 18
      #   uses: actions/setup-node@v6
      #   with:
      #     node-version: 18

      - name: Cache NPM dependencies
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install Dependencies
        run: npm install

      - name: Check Code Coverage
        continue-on-error: true
        run: npm run coverage

      - name: Archive test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Code-coverage-result
          path: coverage
          retention-days: 5

  reports-s3:
    needs: [code-coverage, unit-testing]
    name: AWS S3 - Upload Reports
    runs-on: ubuntu-latest
    continue-on-error: true
    
    steps:
    - name: Download Mocha Test Artifact
      uses: actions/download-artifact@v3
      with:
        name: Mocha-test-result-nodeJS-${{ matrix.nodejs_version }}
      
    - name: Download Code Coverage Artifact
      uses: actions/download-artifact@v3
      with:
        name: Code-coverage-result

    - name: Merge Test Files
      run: |
        ls -ltr
        mkdir reports-${{github.sha}}
        mv test-results-nodeJS-${{ matrix.nodejs_version }}.xml reports-${{github.sha}}/
        mv cobertura-coverage.xml reports-${{github.sha}}/
        ls -ltr reports-${{github.sha}}/
    
    - name: upload to AWS S3
      run: echo "uploading....."
      
  Docker:
    name: Containerization
    needs: [unit-testing, code-coverage]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Dockerhub Login
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      
      - name: Docker build for testing
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: ${{ vars.DOCKERHUB_USERNAME }}/solar-system-lab:${{ github.sha }}
          build-args: |
            MONGO_URI='mongodb+srv://supercluster.d83jj.mongodb.net/superData'
            MONGO_USERNAME=${{ vars.MONGO_USERNAME }}
            MONGO_PASSWORD=${{ secrets.MONGO_PASSWORD }}

      - name: Docker Image Testing
        run: |
          docker images
          docker run --name solar-system-app -d -p 3000:3000 \
            ${{ vars.DOCKERHUB_USERNAME }}/solar-system-lab:${{ github.sha }}
          
          docker exec solar-system-app printenv | grep -E "MONGO_URI|MONGO_USERNAME|MONGO_PASSWORD"

          IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' solar-system-app)
          echo "Container IP: $IP"

          echo "Testing image URL using wget"
          wget -q -O - 127.0.0.1:3000/live | grep live

      - name: Docker Push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/solar-system-lab:${{ github.sha }}
          build-args: |
            MONGO_URI='mongodb+srv://supercluster.d83jj.mongodb.net/superData'
            MONGO_USERNAME=${{ vars.MONGO_USERNAME }}
            MONGO_PASSWORD=${{ secrets.MONGO_PASSWORD }}

  Dev-Deploy:
    needs: Docker
    if: contains(github.ref, 'feature/')
    uses: ./.github/workflows/reuse-deployment.yaml
    secrets:
      k8s_kubeconfig: ${{ secrets.KUBECONFIG}}
      mongodb_password: ${{ secrets.MONGO_PASSWORD}}
    with:
      environment: development
      k8s-manifest-directory: kubernetes/development/

  Integration-testing:
    name: Dev integration testing
    if: contains(github.ref, 'feature/')    
    needs: Dev-Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Test URL Output using Curl & JQ
        env:
          URL: ${{ needs.Dev-Deploy.outputs.application_url }}
        run: 
          echo $URL
          echo "----------------------------------------"
          curl https://$URL/live -s -k | jq -r .status | grep -i live

  Prod-Deploy:
    if: github.ref == 'refs/heads/main'
    needs: Docker
    environment: 
      name: production
      url: https://${{ steps.set-ingress-host-address.outputs.APP_INGRESS_HOST }}
    outputs:
      APP_INGRESS_URL: ${{ steps.set-ingress-host-address.outputs.APP_INGRESS_HOST }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Install Kubectl CLI
        uses: azure/setup-kubectl@v4
        with:
         version: 'v1.32.0'

      - name: Set Kubeconfig
        uses: azure/k8s-set-context@v5
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}
        
         
      - name: Fetch Kubernetes Cluster Details
        run: |
          kubectl version
          echo ---------------------------------------
          kubectl get nodes -o wide

      - name: Save Nginx ngress Controller IP s GITHUB Environment
        run: |
          echo "INGRESS_IP=$(kubectl -n ingress-nginx get services ingress-nginx-controller -o jsonpath="{status.loadbalancer.ingress[0].ip}")" >> $GITHUB_ENV

      - name: Prepare Kubernetes Manifest and replace tokens
        uses: cschleiden/replace-tokens@v1
        with:
          tokenPrefix: '_{_'
          tokenSuffix: '_}_'
          files: '["kubernetes/production/*.yaml"]'
        env:
          NAMESPACE: ${{ vars.NAMESPACE}}
          REPLICAS: ${{ vars.REPLICAS }}
          IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/solar-system-lab:${{ github.sha }}
          INGRESS_IP: ${{ env.INGRESS_IP }}

      - name: Verify Manifests Correctness
        run: |
          cat kubernetes/production/*.yaml

      - name: Deploy to Production ENV
        run: |
          kubectl apply -f kubernetes/production/
      
      - name: Set App Ingress Host
        id: set-ingress-host-address
        run: |
          echo "APP_INGRESS_HOST"=$(kubectl -n ${{ vars.NAMESPACE }} get ingress -o jsonpath="{.items[0].spec.tls[0].hosts[0]}") >> "$GITHUB.OUTPUT"

  Integration-testing:
    name: Prod integration testing
    if: github.ref == 'refs/heads/main'
    needs: Prod-Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Test URL Output using Curl & JQ
        env:
          URL: ${{ needs.Prod-Deploy.outputs.APP_INGRESS_URL }}
        run: 
          echo $URL
          echo "----------------------------------------"
          curl https://$URL/live -s -k | jq -r .status | grep -i live