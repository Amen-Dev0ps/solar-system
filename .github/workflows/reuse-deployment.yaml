name: Deployment Reusable Workflow

on: 
  workflow_call:
    inputs:
        kubectl-version:
            description: Provide the required Kubectl version
            default: v1.32.0
            required: false
            type: string
        k8s-manifest-directory:
            description: Directory containing Kubernetes manifest files
            default: kubernetes/
            required: true
            type: string
        environment:
            description: Provide the deployment environment
            required: true
            type: string

    secrets:
        k8s_kubeconfig:
            required: true
        mongodb_password:
            required: true

    outputs:
        application_url:
          value: ${{ jobs.reuse-deploy.outputs.APP_INGRESS_URL }}


jobs:
  reuse-deploy:
    environment: 
      name: ${{ inputs.environment}}
      url: https://${{ steps.set-ingress-host-address.outputs.APP_INGRESS_HOST }}
    outputs:
      APP_INGRESS_URL: ${{ steps.set-ingress-host-address.outputs.APP_INGRESS_HOST }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Install Kubectl CLI
        uses: azure/setup-kubectl@v4
        with:
          version: '${{inputs.kubectl-version}}'

      - name: Set Kubeconfig
        uses: azure/k8s-set-context@v5
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.k8s_kubeconfig }}
        
      - name: Fetch Kubernetes Cluster Details
        run: |
          kubectl version
          echo ---------------------------------------
          kubectl get nodes -o wide

      - name: Save Nginx Ingress Controller IP to GITHUB Environment
        run: |
          echo "INGRESS_IP=$(kubectl -n ingress-nginx get services ingress-nginx-controller -o jsonpath='{status.loadbalancer.ingress[0].ip}')" >> $GITHUB_ENV

      - name: Prepare Kubernetes Manifest and replace tokens
        uses: cschleiden/replace-tokens@v1
        with:
          tokenPrefix: '_{_'
          tokenSuffix: '_}_'
          files: '["${{ inputs.k8s-manifest-directory }}*.yaml"]'
        env:
          NAMESPACE: ${{ vars.NAMESPACE }}
          REPLICAS: ${{ vars.REPLICAS }}
          IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/solar-system-lab:${{ github.sha }}
          INGRESS_IP: ${{ env.INGRESS_IP }}

      - name: Verify Manifests Correctness
        run: |
          cat ${{ inputs.k8s-manifest-directory }}*.yaml

      - name: Deploy to ${{ inputs.environment }} ENV
        run: |
          kubectl apply -f ${{ inputs.k8s-manifest-directory }}
      
      - name: Set App Ingress Host
        id: set-ingress-host-address
        run: |
          echo "APP_INGRESS_HOST=$(kubectl -n ${{ vars.NAMESPACE }} get ingress -o jsonpath='{.items[0].spec.tls[0].hosts[0]}')" >> "$GITHUB_OUTPUT"